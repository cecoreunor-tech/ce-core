<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CE CORE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fc;--sf:#fff;--sf2:#eaf2fb;--tx:#0f2140;--mu:#5a6b86;--bd:#cfe0f3;--h:#0b2a5b;--b:#1d5fb0;--c:#00a8ee;--s:#9fd0ff;--gd:#b8964f;--gl:#f5e0a8;--ok:#17814f;--bad:#d64545;--n1:#0b2a5b;--n2:#04122b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#061226;--sf:#0d2045;--sf2:#13305e;--tx:#e6efff;--mu:#9fb3d6;--bd:#234474;--h:#bfe0ff;--b:#5aa7f5;--ok:#38c07f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#061226;--sf:#0d2045;--sf2:#13305e;--tx:#e6efff;--mu:#9fb3d6;--bd:#234474;--h:#bfe0ff;--b:#5aa7f5;--ok:#38c07f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Rajdhani,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--n1);z-index:20}
.app{display:flex;min-height:100vh}
nav{width:218px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px;background:linear-gradient(180deg,var(--n1),var(--n2));display:flex;flex-direction:column;gap:4px;z-index:15}
.lg{background:#fff;border-radius:12px;padding:6px;margin-bottom:12px;box-shadow:0 0 0 2px var(--s),0 0 0 4px var(--gd)}.lg img{display:block;width:100%;height:auto;animation:fl 5s ease-in-out infinite}
nav .n{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:#d6e6fa;padding:9px 10px;border-radius:6px;font:inherit;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:.25s}
nav .n:hover,nav .n.on{background:#ffffff1f;color:#fff;transform:translateX(3px)}nav .n.on{border-left-color:var(--gd)}nav em{font-size:10px;color:var(--gl);border:1px solid var(--gd);border-radius:8px;padding:0 5px;font-style:normal}
.sp{flex:1}.xpc{font:600 11px Orbitron,sans-serif;color:var(--gl);text-align:center;letter-spacing:.08em;padding:6px 0}
main{flex:1;min-width:0;padding:18px;background-image:linear-gradient(color-mix(in srgb,var(--bd) 40%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--bd) 40%,transparent) 1px,transparent 1px);background-size:32px 32px;animation:gd 60s linear infinite}
h1{position:relative;overflow:hidden;font:800 18px Orbitron,sans-serif;letter-spacing:.08em;margin:0 0 12px;padding:16px 18px;border-radius:10px;color:#fff;background:linear-gradient(105deg,var(--n1) 0 62%,var(--c) 62% 63.5%,var(--n1) 63.5% 72%,var(--gd) 72% 73.5%,var(--n1) 73.5%)}
h1::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,#ffffff2e 50%,transparent 60%);transform:translateX(-100%);animation:sh 6s ease-in-out infinite}
h2{font:700 12px Orbitron,sans-serif;margin:0 0 10px;color:var(--h);letter-spacing:.12em;text-transform:uppercase}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:12px 0}
.c{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--gd);border-radius:10px;padding:14px;min-width:0;animation:up .5s both}
.g>.c:nth-child(2){animation-delay:.08s}.g>.c:nth-child(3){animation-delay:.16s}.g>.c:nth-child(4){animation-delay:.24s}
.big{font:800 26px Orbitron,sans-serif;color:var(--b)}.mu,small{color:var(--mu)}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}button{cursor:pointer;transition:.2s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.p{background:linear-gradient(135deg,var(--b),var(--n1));color:#fff;border-color:var(--n1);font-weight:700}button.gb{background:linear-gradient(135deg,var(--gl),var(--gd));color:#2a2005;border-color:var(--gd);font-weight:700}
:focus-visible{outline:2px solid var(--c);outline-offset:1px}textarea{width:100%;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
label{display:flex;flex-direction:column;gap:3px;color:var(--mu);font-size:13px;flex:1 1 200px}.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:flex-end}.sm{width:70px}
.bar{height:8px;background:var(--sf2);border-radius:5px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c));border-radius:5px;animation:gw 1s}
.tg{display:inline-block;padding:0 9px;border-radius:9px;font-size:12px;font-weight:700;border:1px solid currentColor;background:color-mix(in srgb,currentColor 14%,transparent);white-space:nowrap}
.t0{color:var(--mu)}.t1{color:#d64545}.t2{color:#2b84e0}.t3{color:#5b6fe0}.t4{color:#c9a227}.t5{color:#00a8ee}

.emw{position:relative;width:200px;height:200px;flex:none}.orb{position:absolute;inset:0;width:100%;height:100%}.emw::before{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d5fb0cc,#04122bee 72%);box-shadow:0 0 0 2px var(--gd),inset 0 0 30px #00a8ee66}.emw{transform-style:preserve-3d;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}.em{position:absolute;width:68%;left:16%;top:21%;transform:translateZ(28px);animation:br 4.5s ease-in-out infinite}.emw::after{content:"";position:absolute;inset:13%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(180deg,transparent 0 44%,#7fd8ff88 49%,#e6f7ffee 50%,#7fd8ff88 51%,transparent 56% 100%);background-size:100% 300%;animation:ls 3.4s ease-in-out infinite}.hx{fill:none;stroke:#00a8ee;stroke-width:2;transform-origin:150px 150px;opacity:0;animation:hx 3.6s ease-out infinite}.hd{fill:none;stroke:#b8964f;stroke-width:1.8;stroke-dasharray:1;animation:hd 8s ease-in-out infinite}.pk{fill:#f5e0a8;opacity:.25;animation:pk 3s ease-in-out infinite}.rb{opacity:0;animation:rs 3.6s ease-in infinite}
.r1,.r2,.od{transform-origin:150px 150px}.r1{animation:sp 70s linear infinite}.r2{animation:sp 40s linear infinite reverse}.od{animation:sp 20s linear infinite}.pr{transform-origin:150px 150px;animation:pu 3.6s ease-out infinite}
.ht{flex:1 1 300px;min-width:0}.wm{font:800 34px Orbitron,sans-serif;letter-spacing:.14em;background:linear-gradient(90deg,var(--gd),var(--gl),var(--gd));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
.tgl{letter-spacing:.3em;font-size:12px;color:var(--s);margin:2px 0 12px}.lp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 11px Orbitron,sans-serif}.lp span{padding:4px 10px;border-radius:14px;border:1px solid var(--gd);animation:lt 6s infinite}.lp i{color:var(--gd);font-style:normal}
.hs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hs div{background:#ffffff14;border:1px solid #ffffff30;border-radius:10px;padding:6px 14px;backdrop-filter:blur(4px)}.hs b{display:block;font:800 20px Orbitron,sans-serif;color:var(--gl)}.hs small{color:#c9dcf5}
.mr{display:grid;grid-template-columns:60px 1fr 42px;gap:8px;align-items:center;font-weight:700}.mr span{text-align:right}
.rg{transform:rotate(-90deg);transform-origin:60px 60px;animation:rd 1.3s ease-out}
.pads{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.pads input{width:100%;font-weight:700;margin-bottom:4px}.pads textarea{min-height:130px;font-family:inherit;background:#fff9e0;color:#2a2005;border-color:var(--gd)}
.tb{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.tb button{min-width:34px;padding:3px 8px}.pvb{min-height:60px;border:1px dashed var(--bd);border-radius:8px;padding:8px;overflow-x:auto}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.st>div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;animation:up .5s both}.st b{display:block;font:800 20px Orbitron,sans-serif;color:var(--b)}
.fc{perspective:1100px;height:240px;cursor:pointer;margin:10px 0;position:relative}.fi{position:absolute;inset:0;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}.fc.fl .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;overflow:auto;font-size:20px}
.front{background:linear-gradient(135deg,var(--n1),#1d5fb0);color:#fff;border:1px solid var(--gd);box-shadow:0 8px 30px #0b2a5b55}.back{transform:rotateY(180deg);background:linear-gradient(135deg,#fff8e4,var(--gl));color:#2a2005;border:1px solid var(--gd)}
.ff small{color:inherit;opacity:.7;font-size:12px;letter-spacing:.14em}.cin{animation:ci .45s both}.ok-f{animation:okf .6s}.no-f{animation:nof .5s}
.pop{position:absolute;right:16px;top:6px;font:800 22px Orbitron,sans-serif;color:var(--gd);animation:pp 1.2s both;pointer-events:none;z-index:5}.pop.bad{color:var(--bad)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.cf i{position:absolute;top:-10px;left:var(--x);width:9px;height:14px;background:var(--k);animation:cf 2.6s var(--d) ease-in forwards}
.tl{border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--sf2);animation:up .4s both}.tl.t1{border-color:#d64545;animation:fp 2.4s infinite}.tl.t5{border-color:#00a8ee;box-shadow:0 0 14px #00a8ee55}.tl.t4{border-color:#c9a227}

 document.querySelectorAll('[data-r="'+q+'"] button').forEach((b,i)=>{b.classList.toggle('sel4',RUN.ans[q]==i);b.setAttribute('aria-pressed',RUN.ans[q]==i)});const e=$('#ansn');if(e)e.textContent=RUN.ans.filter(a=>a>=0).length}
function scoreAttempt(s,att){const n=s.n,per={},tops={};let sc=0;
 s.q.forEach((q,i)=>{const ok=att.ans[i]==q.a;if(ok)sc++;const tn=q.tn||(q.ar&&!AR.includes(q.ar)?q.ar:'');if(tn){const p=tops[tn]||(tops[tn]={s:0,t:0});p.t++;if(ok)p.s++}if(q.ar){const p=per[q.ar]||(per[q.ar]={s:0,t:0});p.t++;if(ok)p.s++}});
 let fin=null;if(PBT.includes(s.type)&&AR.every(k=>per[k]&&per[k].t>0))fin=AR.reduce((a,k)=>a+WT[k]*Math.round(per[k].s/per[k].t*100),0);
 let ml=0;if(!s.sample){Object.entries(tops).forEach(([tn,v])=>S.map.filter(m=>nz(m.name)==nz(tn)).forEach(m=>{m.log.push({v:+(v.s/v.t*100).toFixed(1),d:att.date});ml++}));S.xp+=sc;dayS().quiz++}
 s.runs=s.runs||[];s.runs.push({date:att.date,ts:Date.now(),score:sc,total:n,dur:+att.H.toFixed(2),fin,per:Object.fromEntries(Object.entries(per).map(([k,v])=>[k,[v.s,v.t]])),tops:Object.fromEntries(Object.entries(tops).map(([k,v])=>[k,[v.s,v.t]]))});
 RES={sample:!!s.sample,fin,sid:s.id,name:s.name,n,sc,hrs:att.H,lim:att.lim,auto:att.auto,per,ml,q:s.q,ans:att.ans.slice()};RF=false;return RES}
function finishExam(auto){if(!RUN)return;const s=S.sims.find(x=>x.id==RUN.id),att={ans:RUN.ans.slice(),tq:RUN.tq.slice(),H:(Math.min(Date.now(),RUN.end)-RUN.start)/36e5,lim:RUN.hrs,auto,date:today()};RUN=null;S.run=null;clearInterval(STM);RF=false;
 if(keyDone(s))scoreAttempt(s,att);else{s.pending=att;RES={pending:true,sid:s.id,name:s.name,n:s.n,hrs:att.H,lim:att.lim,auto,done:att.ans.filter(a=>a>=0).length,keyHas:s.q.filter(x=>x.a>=0).length}}
 save();if(page=='assess')rr();else toast(RES.pending?'Exam submitted. Upload the answer key to score it.':'Simulation submitted and scored')}

const sampleCard=()=>`<div class="c" style="margin:12px 0"><h2>Sample</h2><div class="mu">A 13-question practice questionnaire (MSTHC · HPGE · PSAD; question 13 has a figure) with its answer key. Sample runs are <b>not</b> logged to the CORE Map. Both files are built into this page.</div><div class="row"><button class="p" onclick="addSample()">Add sample simulation</button><button onclick="dlf('sample_questionnaire.pdf',SAMPLE_PDF)">Download sample_questionnaire.pdf</button><button onclick="dlf('sample_answer_key.csv',SAMPLE_KEY,true)">Download sample_answer_key.csv</button></div><details><summary>Show the sample answer key CSV</summary><textarea readonly id="xS" onfocus="this.select()" style="min-height:140px;font-family:monospace;font-size:12px">${esc(SAMPLE_KEY)}</textarea></details></div>`;
async function addSample(){S.sims.filter(s=>s.sample).forEach(s=>pdfDel(s.pkey));S.sims=S.sims.filter(s=>!s.sample);const k=parseKey(SAMPLE_KEY,13),b=atob(SAMPLE_PDF.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const id=uid(),pk='pdf_'+id,ty=PBT[0];await pdfPut(pk,u.buffer);
 S.sims.push({id,sample:true,type:ty,name:'SAMPLE · Practice Set',topic:'Sample questions (not your exam)',cov:'MSTHC · HPGE · PSAD',hrs:.25,n:13,pdf:'sample_questionnaire.pdf',pkey:pk,q:k.items,runs:[]});SW=ty;save();toast('Sample added to '+ty);rr()}
function listView(tabs){const L0=S.sims,cn=t=>L0.filter(s=>s.type==t).length,W=SW||TY.find(cn)||TY[0],L=L0.filter(s=>s.type==W);
 return`<h1>ASSESSMENT · SIMULATIONS</h1>${tabs}<div class="c"><h2>New simulation</h2><div class="mu">Upload your questionnaire as a PDF. During the exam it is shown exactly as it is, next to an answer sheet with A, B, C, D buttons for every number. The answer key is a separate CSV; add it now or later.</div>
<div class="row">${fi('xN','Simulation name')}${fs('xY','Exam type',TY,W)}${fi('xT','Topic')}${fi('xC','Coverage')}${fi('xH','Time limit (hr)','number','3','min="0" step="any"')}${fi('xQ','Number of questions','number','','min="1" max="500" step="1"')}</div>
<div class="row"><label>Questionnaire (PDF)<input id="xF" type="file" accept="application/pdf,.pdf"></label><label>Answer key (CSV, optional for now)<input id="xK" type="file" accept=".csv,text/csv"></label></div>
<small class="mu">Answer key CSV: columns Number, Answer (A to D). Optional columns: Area (MSTHC, HPGE or PSAD), Topic (a specific topic name from your CORE Map; its score is logged there) and Explanation. A plain list of letters, one per row, also works.</small>
<div class="row"><button class="p" onclick="addSim()">Create simulation</button></div></div>${sampleCard()}
<h2 style="margin-top:14px">Workspaces</h2><div class="row">${TY.map(t=>`<button class="${t==W?'p':''}" onclick="SW='${t}';rr()">${t} · ${cn(t)}</button>`).join('')}</div>
<div class="g">${L.map(s=>{const l=s.runs&&s.runs[s.runs.length-1],kd=keyDone(s),kg=s.q.filter(x=>x.a>=0).length;return`<div class="c"><h2>${esc(s.name)}${s.sample?' <span class="tg t0">sample</span>':''}</h2><div>Topic: <b>${esc(s.topic||'—')}</b></div><div>Coverage: <b>${esc(s.cov||'—')}</b></div><div><b>${s.n}</b> questions · <b>${s.hrs}</b> hr</div><div><small>PDF: ${esc(s.pdf)}</small></div><div>${kd?'<span class="tg t2">Answer key ready</span>':`<span class="tg t1">${kg?'Answer key incomplete ('+kg+'/'+s.n+')':'No answer key yet'}</span>`}${s.pending?' <span class="tg t3">1 attempt waiting for the key</span>':''}</div>${l?`<small>Last: ${l.score}/${l.total} (${f2(l.fin!=null?l.fin:l.score/l.total*100)}%) on ${l.date} · ${s.runs.length} attempt${s.runs.length>1?'s':''}</small>`:'<small>Not attempted yet.</small>'}<div class="row"><button class="p" onclick="SV={v:'pre',id:'${s.id}'};rr()">Open &amp; start</button>${keyUp(s.id,kd?'Replace answer key':'Upload answer key')}<button onclick="cfm(this,()=>delSim('${s.id}'))">Delete</button></div></div>`}).join('')||'<p class="mu">No simulations in this workspace yet. Create one above.</p>'}</div>`}
function preView(){const s=S.sims.find(x=>x.id==SV.id);if(!s){SV={v:'list',id:null};return listView('')}const ar={};s.q.forEach(q=>{if(q.ar)ar[q.ar]=(ar[q.ar]||0)+1});const kd=keyDone(s),kg=s.q.filter(x=>x.a>=0).length;
 return`<h1>ASSESSMENT · SIMULATIONS</h1><div class="c"><h2>${esc(s.name)}${s.sample?' <span class="tg t0">sample</span>':''}</h2><div class="g"><div><small>Exam type</small><br><b>${esc(s.type)}</b></div><div><small>Topic</small><br><b>${esc(s.topic||'—')}</b></div><div><small>Coverage</small><br><b>${esc(s.cov||'—')}</b></div><div><small>Number of questions</small><br><b>${s.n}</b></div><div><small>Time limit</small><br><b>${s.hrs} hr</b></div></div>
<div><small>Questionnaire: ${esc(s.pdf)}</small></div><div style="margin:4px 0">${kd?'<span class="tg t2">Answer key ready</span>':`<span class="tg t1">${kg?'Answer key incomplete ('+kg+'/'+s.n+')':'No answer key yet'}</span> <small class="mu">You can still take the exam; it will be scored as soon as you upload the key.</small>`}${Object.keys(ar).length?` <small>Areas: ${Object.entries(ar).map(a=>esc(a[0])+' '+a[1]).join(' · ')}</small>`:''}</div>
<div class="row">${fi('xH2','Time limit for this attempt (hours)','number',s.hrs,'min="0.01" step="any"')}</div><p class="mu">The timer starts when you press Start and the exam submits itself when time runs out. Your answers autosave. Once an answer key is in place the result is scored automatically, and topic scores flow into the CORE Map.</p><div class="row"><button class="gb" onclick="startExam('${s.id}')">▶ Start exam</button>${keyUp(s.id,kd?'Replace answer key':'Upload answer key (CSV)')}<label class="btnl">Replace PDF<input type="file" accept="application/pdf,.pdf" hidden onchange="replacePdf('${s.id}',this)"></label><button onclick="SV={v:'list',id:null};rr()">Back to workspace</button></div></div>`}
function examView(){const s=S.sims.find(x=>x.id==RUN.id),n=s.n,done=RUN.ans.filter(a=>a>=0).length;
 return`<h1>ASSESSMENT · SIMULATIONS</h1><div class="c xbar"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><div><h2 style="margin:0">${esc(s.name)}</h2><small>${esc(s.type)} · Topic: ${esc(s.topic||'—')} · Coverage: ${esc(s.cov||'—')} · ${n} questions · ${RUN.hrs} hr</small></div><div style="text-align:right"><div class="tm" id="tmr">${fmt(RUN.end-Date.now())}</div><small>Answered <span id="ansn">${done}</span>/${n}</small></div></div></div>
<div class="xv"><div class="c" style="padding:8px"><div class="row" style="margin:0 0 6px;align-items:center"><small class="mu" style="flex:1">Questionnaire · ${esc(s.pdf)}</small><button onclick="dlPdf()" title="Save a copy of the questionnaire PDF">Save PDF</button><button onclick="pdfZoom(-.15)" aria-label="Zoom out">−</button><button onclick="pdfZoom(.15)" aria-label="Zoom in">+</button></div><div id="pdfv"><div class="mu" style="padding:12px">Loading the questionnaire…</div></div></div>
<div class="c sheet"><h2>Answer sheet</h2>${Array.from({length:n},(_,i)=>`<div class="ar4" data-r="${i}"><b>${i+1}</b>${[0,1,2,3].map(c=>`<button class="${RUN.ans[i]==c?'sel4':''}" onclick="sAns(${i},${c})" aria-label="Question ${i+1}, ${LET[c]}" aria-pressed="${RUN.ans[i]==c}">${LET[c]}</button>`).join('')}</div>`).join('')}<div class="row"><button class="p" onclick="cfm(this,()=>finishExam(false))">Submit exam</button></div><small class="mu">Tap a letter again to clear it.</small></div></div>`}
function resView(){const r=RES;if(r.pending)return`<h1>ASSESSMENT · SIMULATIONS</h1><div class="c"><h2>Answers saved · ${esc(r.name)}</h2><p>You answered <b>${r.done}</b> of ${r.n} questions in ${r.hrs.toFixed(2)} hr${r.auto?' (time ran out)':''}. The answer key is ${r.keyHas?'incomplete ('+r.keyHas+' of '+r.n+')':'not uploaded yet'}, so the exam cannot be scored. Upload the answer key CSV for this simulation and it will be scored automatically.</p><div class="row">${keyUp(r.sid,'Upload answer key (CSV)','pm')}<button onclick="RES=null;SV={v:'list',id:null};rr()">Back to workspace</button></div></div>`;

async function syncPush(){if(!SYNC.db){return}if(SYNC.busy){SYNC.again=1;return}SYNC.busy=true;clearTimeout(syncT);const db=SYNC.db,uid=SESS.uid;
 try{const now=new Date().toISOString(),d0={...S};delete d0.run;const sl=HQ.slim(d0),sn=HQ.snapOf(sl,now),last=(S.snaps||[]).slice(-1)[0];

 finally{SYNC.busy=false;paintSync();if(SYNC.again){SYNC.again=0;syncSoon(2000)}}}
